<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f14" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)" />

  <!-- KPI tiles -->
  <g>
    <rect x="40" y="35" width="96" height="40" fill="#161616" stroke="#63A54D" stroke-width="2" />
    <rect x="152" y="35" width="96" height="40" fill="#161616" stroke="#e6b800" stroke-width="2" />
    <rect x="264" y="35" width="96" height="40" fill="#161616" stroke="#e03131" stroke-width="2" />
    <rect x="52" y="49" width="48" height="12" fill="#63A54D" />
    <rect x="164" y="49" width="36" height="12" fill="#e6b800" />
    <rect x="276" y="49" width="28" height="12" fill="#e03131" />
  </g>

  <!-- monthly revenue bars -->
  <g opacity="0.9">
    <rect x="48" y="200" width="24" height="40" fill="#2f9e44" />
    <rect x="80" y="180" width="24" height="60" fill="#37b24d" />
    <rect x="112" y="190" width="24" height="50" fill="#2f9e44" />
    <rect x="144" y="160" width="24" height="80" fill="#37b24d" />
    <rect x="176" y="140" width="24" height="100" fill="#63A54D" />
    <rect x="208" y="120" width="24" height="120" fill="#37b24d" />
    <rect x="240" y="105" width="24" height="135" fill="#63A54D" />
    <rect x="272" y="130" width="24" height="110" fill="#37b24d" />
    <rect x="304" y="165" width="24" height="75" fill="#2f9e44" />
    <rect x="336" y="185" width="24" height="55" fill="#37b24d" />
  </g>

  <!-- axis -->
  <rect x="40" y="240" width="320" height="3" fill="#ffffff" />

  <!-- dashed cancellation-rate line -->
  <polyline points="60,150 92,140 124,155 156,125 188,135 220,110 252,120 284,95 316,115 348,100" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 6" />
</svg>

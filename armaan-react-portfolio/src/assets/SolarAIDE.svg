    <rect x="160" y="45" width="40" height="40" fill="#e6b800" />
    <rect x="200" y="45" width="40" height="40" fill="#f2c94c" />
    <rect x="160" y="85" width="40" height="40" fill="#e6b800" />
    <rect x="40" y="125" width="40" height="40" fill="#f2c94c" />

    <rect x="120" y="205" width="40" height="40" fill="#2f9e44" />
    <rect x="160" y="205" width="40" height="40" fill="#c92a2a" />
    <rect x="200" y="205" width="40" height="40" fill="#37b24d" />
    <rect x="240" y="205" width="40" height="40" fill="#2f9e44" />
    <rect x="280" y="205" width="40" height="40" fill="#e6b800" />
    <rect x="320" y="205" width="40" height="40" fill="#37b24d" />

    <rect x="40" y="165" width="40" height="40" fill="#2f9e44" />
    <rect x="80" y="165" width="40" height="40" fill="#37b24d" />
    <rect x="120" y="165" width="40" height="40" fill="#e6b800" />
    <rect x="160" y="165" width="40" height="40" fill="#37b24d" />
    <rect x="200" y="165" width="40" height="40" fill="#c92a2a" />
